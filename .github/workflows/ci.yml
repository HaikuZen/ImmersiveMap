name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reading the checkout is all any job here does. Artifact upload needs no
# token scope of its own.
permissions:
  contents: read

jobs:
  test:
    name: Build & Test (SPM)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # Every build compiles the shaders (the MetalLibraryPlugin build tool
  # plugin), so the job above runs the Metal-backed tests too, but lets them
  # skip where the runner has no GPU. This job runs them through Xcode, as an
  # app built in Xcode gets them, and requires Metal: a runner that cannot
  # render fails here instead of passing having rendered nothing.
  #
  # The picture tests (a frame rendered offscreen and judged by its pixels)
  # are not part of this job or any other: they are brittle and are run by
  # hand only, with IMMERSIVE_MAP_RUN_PICTURE_TESTS=1. Do not set that here.
  gpu-test:
    name: Test with shaders (Xcode, macOS)
    runs-on: macos-26

    env:
      # Turns "this machine cannot render" from a silent skip into a failure.
      # A runner that loses Metal must make this job red rather than let it
      # pass having rendered nothing. Set twice on purpose: the plain name is
      # inherited by a macOS test process, the TEST_RUNNER_ prefixed one is the
      # documented way to reach a test runner xcodebuild launches itself.
      IMMERSIVE_MAP_REQUIRE_METAL: "1"
      TEST_RUNNER_IMMERSIVE_MAP_REQUIRE_METAL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate the package workspace
        uses: ./.github/actions/package-workspace

      - name: Test
        shell: bash
        run: .github/scripts/run-xcodebuild-test.sh 'platform=macOS' gpu

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-results
          path: gpu-TestResults.xcresult
          retention-days: 7

  # The UIKit half of the platform layer (host view, gestures, display link)
  # only compiles and runs on iOS, so the macOS jobs above never touch it.
  ios-test:
    name: Test (Xcode, iOS Simulator)
    runs-on: macos-26

    env:
      IMMERSIVE_MAP_REQUIRE_METAL: "1"
      TEST_RUNNER_IMMERSIVE_MAP_REQUIRE_METAL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate the package workspace
        uses: ./.github/actions/package-workspace

      # The device list of a runner image is not something to hardcode: take
      # whatever iPhone this image ships and fail loudly if it ships none.
      #
      # The UDID is what gets passed on, not the name. Device names contain
      # parentheses ("iPhone SE (3rd generation)"), so anything that reads the
      # human-readable listing risks handing xcodebuild a truncated name that
      # matches no device.
      - name: Pick a simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | jq -r '
            [ .devices
              | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | .value[]
              | select(.name | startswith("iPhone"))
            ] | last // empty | "\(.udid)\t\(.name)"')
          if [ -z "$device" ]; then
            echo "No iPhone simulator is available on this runner image" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          udid=${device%%$'\t'*}
          echo "Using ${device#*$'\t'} ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        shell: bash
        run: .github/scripts/run-xcodebuild-test.sh "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" ios

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios-TestResults.xcresult
          retention-days: 7

  # Off Apple's platforms the package is its portable targets: the tile
  # formats, the geometry tools and PortableFoundation, with the stand-ins for
  # Apple's simd and os (see CLAUDE.md, "Portable targets"). The macOS jobs
  # above never build that package, so a change that brings an Apple-only API
  # into it fails here or nowhere.
  #
  # The Swift here is not the macOS jobs' Xcode Swift but the release the
  # portable package was brought up and tested with. The default build
  # system misreads the GNU linker's version, so these use the native one.
  linux-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests --build-system native

      - name: Test
        run: swift test --build-system native

      # The slim build (the one meant for a browser) has its own geometry
      # types and lock, and keeps only the tests that run without Foundation.
      - name: Test the slim build
        env:
          IMMERSIVE_MAP_SLIM: "1"
        run: swift test --build-system native --scratch-path .build-slim

  # The same package for WebAssembly, its tests run by the toolchain's own
  # runtime (WasmKit, an interpreter, so the flattener's tests take minutes).
  # The test binary is given the checkout, for the Earcut fixtures, and /tmp,
  # where the file tests write.
  wasm-test:
    name: Build & Test (WebAssembly)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble

    env:
      WASM_SDK: swift-6.4.2-RELEASE_wasm
      WASM_SDK_URL: https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz
      WASM_SDK_CHECKSUM: 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the WebAssembly SDK
        run: swift sdk install "$WASM_SDK_URL" --checksum "$WASM_SDK_CHECKSUM"

      - name: Build
        run: swift build --swift-sdk "$WASM_SDK" --build-tests --build-system native

      - name: Test (XCTest)
        run: wasmkit run --dir "$PWD" --dir /tmp .build/wasm32-unknown-wasip1/debug/ImmersiveMapPackageTests.xctest

      - name: Test (Swift Testing)
        run: wasmkit run --dir "$PWD" --dir /tmp .build/wasm32-unknown-wasip1/debug/ImmersiveMapPackageTests.xctest --testing-library swift-testing

      - name: Build the slim build
        env:
          IMMERSIVE_MAP_SLIM: "1"
        run: swift build --swift-sdk "$WASM_SDK" --build-tests --build-system native --scratch-path .build-slim

      - name: Test the slim build
        run: wasmkit run --dir "$PWD" --dir /tmp .build-slim/wasm32-unknown-wasip1/debug/ImmersiveMapPackageTests.xctest --testing-library swift-testing
