<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImmersiveMap in a browser</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080f; color: #cdd6e4; font: 13px/1.4 system-ui, sans-serif; }
  #map { position: fixed; inset: 0; cursor: grab; }
  #map:active { cursor: grabbing; }
  /* Clear of the attribution badge in the bottom right corner. */
  #status { position: fixed; left: 12px; bottom: 12px; max-width: 60%; white-space: pre-wrap; pointer-events: none; }
  #status.error { color: #ff8a80; }
  /* A sample marker: the dot is the element, centred on the city, its name beside it. */
  .marker { width: 8px; height: 8px; border-radius: 50%; background: #ffcc4d; box-shadow: 0 0 0 2px #05080f; }
  .marker span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
                 text-shadow: 0 1px 2px #000; white-space: nowrap; }
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Loading…</div>
<script type="module">
// The engine in a browser, through the page's module (ImmersiveMap.mjs):
// the map drawn by the Swift module with the page's WebGPU, its tiles read
// with the page's fetch, drawn only when something changed. Drag to move,
// the wheel or a pinch to zoom, a right drag or a Shift drag to turn and
// tilt. `?archive=<url>` reads another tile archive, `?msaa=0` turns MSAA
// off, `?markers=0` leaves out the sample markers, `?tilecache=0` reads
// every range from the network, `?credit=<text>` credits another archive's
// data in place of OpenStreetMap (`&creditlink=<url>` its license page).
// Built and served by build.sh.
import { ImmersiveMap } from './ImmersiveMap.mjs';

const status = document.getElementById('status');
const say = (text, isError = false) => { status.textContent = text; status.className = isError ? 'error' : ''; };
const query = new URLSearchParams(location.search);
const errors = [];
const notes = [];

// The engine only logs a failed download, so a host that refuses the
// page's origin (CORS) would leave an empty globe and no word.
const downloadStatus = ({ answered, failed, firstFailure }) => failed === 0 ? '' :
    `${failed} of ${answered + failed} tile archive requests failed, the first with: ${firstFailure}\n`
    + 'If the archive is on another site, its host must allow this page\'s origin (CORS), '
    + 'or serve the archive from this site and open the page with ?archive=/<file>.pmtiles.';
let map = null;
const show = () => {
    if (errors.length > 0) {
        say(`WebGPU error:\n${errors.slice(-3).join('\n')}`, true);
    } else {
        say([map ? downloadStatus(map.downloads) : '', ...notes.slice(-3)].filter(Boolean).join('\n'));
    }
};

try {
    say('Loading the module, the shaders and the resources…');
    map = await ImmersiveMap.create(document.getElementById('map'), {
        archive: query.get('archive') ?? '',
        multisample: query.get('msaa') !== '0',
        tileCache: query.get('tilecache') !== '0',
        attribution: query.has('credit')
            ? { credits: [{ text: query.get('credit') }], link: query.get('creditlink') }
            : true,
        onError: (message) => { errors.push(message); show(); },
        onWarning: (message) => { notes.push(message); show(); },
        onDownloadFailure: show,
    });
    show();
    if (query.get('markers') !== '0') {
        for (const [latitude, longitude, name] of [
            [55.7558, 37.6173, 'Moscow'], [48.8566, 2.3522, 'Paris'], [41.9028, 12.4964, 'Rome'],
            [35.6762, 139.6503, 'Tokyo'], [-33.8688, 151.2093, 'Sydney'], [40.7128, -74.006, 'New York'],
        ]) {
            const element = document.createElement('div');
            element.className = 'marker';
            element.append(Object.assign(document.createElement('span'), { textContent: name }));
            map.addMarker({ latitude, longitude, element });
        }
    }
} catch (error) {
    // Chrome's stack starts with the message, Firefox's leaves it out.
    const stack = error.stack ?? '';
    say(stack.includes(String(error)) ? stack : `${error}\n${stack}`.trim(), true);
}
</script>
</body>
</html>
